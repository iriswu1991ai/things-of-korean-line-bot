name: HANHAN daily TOPIK push

on:
  schedule:
    # Primary window: 07:20-08:20 Asia/Taipei, multiple attempts.
    - cron: "20,30,40,50 23 * * *"
    - cron: "0,10,20 0 * * *"
    # Fallback window for delayed GitHub schedule runs observed on 2026-07-14.
    # The script still refuses to push unless the actual runtime is 07:20-08:30 Asia/Taipei.
    - cron: "20,30,40,50 15 * * *"
    - cron: "0,10,20 16 * * *"
  workflow_dispatch:

concurrency:
  group: hanhan-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate assets, publish images, and push to HANHAN
        env:
          PUBLISH_HANHAN_IMAGES_GITHUB: "1"
          PUSH_HANHAN_LINE: "1"
          PUSH_HANHAN_WORD_SERIES: "1"
          PYTHON: "python"
          LINE_HANHAN_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_HANHAN_CHANNEL_ACCESS_TOKEN }}
          LINE_HANHAN_CHANNEL_SECRET: ${{ secrets.LINE_HANHAN_CHANNEL_SECRET }}
          LINE_HANHAN_TARGET_IDS: ${{ secrets.LINE_HANHAN_TARGET_IDS }}
          HANHAN_IMAGE_BASE_URL: https://raw.githubusercontent.com/iriswu1991ai/things-of-korean-line-bot/main/out/ig
          HANHAN_REQUIRE_TAIPEI_MORNING: "1"
          HANHAN_DEDUPE_GITHUB: "1"
        run: node scripts/generate-ig-images.mjs
