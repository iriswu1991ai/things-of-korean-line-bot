name: HANHAN daily Korean word series

on:
  schedule:
    # 08:00 Asia/Taipei every day.
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: hanhan-word-series
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  push-word-series:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push HANHAN Korean word series
        env:
          LINE_HANHAN_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_HANHAN_CHANNEL_ACCESS_TOKEN }}
          HANHAN_WORD_SERIES_REQUIRE_TAIPEI_MORNING: "0"
        run: node scripts/push-hanhan-word-series.mjs

      - name: Commit word-series state
        run: |
          git add data/hanhan-word-series-state.json
          if git diff --cached --quiet -- data/hanhan-word-series-state.json; then
            echo "HANHAN word-series state already up to date."
          else
            git commit -m "Update HANHAN word series state" -- data/hanhan-word-series-state.json
            git push origin main
          fi
